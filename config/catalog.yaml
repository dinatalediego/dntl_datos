datasets:
  - layer: raw
    source: yahoo_finance
    dataset: prices
    domain: markets
    description: Historical OHLCV market observations downloaded with yfinance.
    grain: ticker x date
    keys: [ticker, date]
    cadence: weekdays
    usage_tier: research_only
    consumers: [python, power_bi, ml]

  - layer: silver
    source: yahoo_finance
    dataset: prices
    domain: markets
    description: Typed and normalized market price observations.
    grain: ticker x date
    keys: [ticker, date]
    cadence: weekdays
    usage_tier: research_only
    consumers: [python, power_bi, ml]

  - layer: raw
    source: world_bank
    dataset: indicators
    domain: macro_global
    description: Country-level economic indicators from the World Bank API.
    grain: country x indicator x year
    keys: [country_code, indicator_code, year]
    cadence: daily_check
    usage_tier: public_api
    consumers: [python, power_bi, econometrics]

  - layer: silver
    source: world_bank
    dataset: indicators
    domain: macro_global
    description: Typed World Bank country-year indicator observations.
    grain: country x indicator x year
    keys: [country_code, indicator_code, year]
    cadence: daily_check
    usage_tier: public_api
    consumers: [python, power_bi, econometrics]

  - layer: raw
    source: bcrp
    dataset: series
    domain: macro_peru
    description: Configured economic time series from BCRP.
    grain: series x period
    keys: [series_code, period_label]
    cadence: daily_check
    usage_tier: public_api
    consumers: [python, power_bi, econometrics]

  - layer: silver
    source: bcrp
    dataset: series
    domain: macro_peru
    description: Typed BCRP series prepared for downstream models.
    grain: series x period
    keys: [series_code, period_label]
    cadence: daily_check
    usage_tier: public_api
    consumers: [python, power_bi, econometrics]

  - layer: raw
    source: musicbrainz
    dataset: peru_artists
    domain: music_intelligence
    description: Artist entities associated with Peru from MusicBrainz search.
    grain: artist entity
    keys: [musicbrainz_id]
    cadence: weekly
    usage_tier: open_data
    consumers: [python, knowledge_graph, ml]

  - layer: raw
    source: wikidata
    dataset: peru_musicians
    domain: music_intelligence
    description: Peruvian musician entities, occupations, genres and birth dates from Wikidata.
    grain: artist x occupation x genre
    keys: [wikidata_id, occupation, genre]
    cadence: weekly
    usage_tier: open_data
    consumers: [python, knowledge_graph, ml]

  - layer: marts
    source: public
    dataset: market_daily_features
    domain: markets
    description: Market prices enriched with returns, moving averages, volatility and drawdown.
    grain: ticker x date
    keys: [ticker, date]
    cadence: weekdays
    usage_tier: analytical
    consumers: [power_bi, ml, econometrics]

  - layer: marts
    source: public
    dataset: macro_country_year
    domain: macro_global
    description: Wide country-year macroeconomic panel ready for BI and econometrics.
    grain: country x year
    keys: [country_code, year]
    cadence: daily_check
    usage_tier: analytical
    consumers: [power_bi, ml, econometrics]

  - layer: marts
    source: public
    dataset: peru_artist_master
    domain: music_intelligence
    description: Canonical Peruvian artist table reconciling MusicBrainz and Wikidata by normalized artist key.
    grain: canonical artist
    keys: [artist_key]
    cadence: weekly
    usage_tier: analytical
    consumers: [power_bi, ml, knowledge_graph]

  - layer: marts
    source: public
    dataset: billboard_artist_snapshot
    domain: music_commercial
    description: Optional Billboard chart snapshot enriched against the Peruvian artist catalog.
    grain: chart x date x rank
    keys: [chart, chart_date, rank]
    cadence: weekly
    usage_tier: research_only
    consumers: [power_bi, ml]

  - layer: marts
    source: statmuse
    dataset: fc_barcelona_laliga_team_sot_matches
    domain: sports_analytics
    description: FC Barcelona LaLiga team shots-on-target match log used to anchor rolling windows.
    grain: club x competition x date
    keys: [club, competition, date]
    cadence: snapshot
    usage_tier: research_only
    consumers: [python, power_bi]

  - layer: marts
    source: statmuse
    dataset: fc_barcelona_laliga_player_sot_windows
    domain: sports_analytics
    description: Player shots-on-target totals and per-team-match rates across L3, L5, L10 and L15 Barcelona LaLiga team-game windows.
    grain: as_of_date x club x competition x player
    keys: [as_of_date, club, competition, player]
    cadence: snapshot
    usage_tier: research_only
    consumers: [python, power_bi, ml]

  - layer: silver
    source: statz
    dataset: fc_barcelona_laliga_player_match_sot
    domain: sports_analytics
    description: Complete L15 Barcelona LaLiga player-appearance rows with minutes, starter flag, venue, opponent and shots on target.
    grain: competition x club x date x player appearance
    keys: [competition, club, date, player]
    cadence: snapshot
    usage_tier: research_only
    consumers: [python, power_bi, ml]

  - layer: marts
    source: statz
    dataset: fc_barcelona_laliga_player_sot_profiles_l5
    domain: sports_analytics
    description: L5 player SOT profile with averages, hit rates, dispersion, venue splits, minutes, SOT per 90 and trend.
    grain: as_of_date x competition x club x player
    keys: [as_of_date, competition, club, player]
    cadence: snapshot
    usage_tier: research_only
    consumers: [python, power_bi, ml]


  - layer: silver
    source: statmuse
    dataset: fc_barcelona_laliga_player_match_grid_l15
    domain: sports_analytics
    description: Dense 15-match x 31-player grid that explicitly distinguishes appearances from did-not-appear rows.
    grain: as_of_date x competition x club x date x player
    keys: [as_of_date, competition, club, date, player]
    cadence: snapshot
    usage_tier: research_only
    consumers: [python, power_bi, ml]

  - layer: marts
    source: statmuse
    dataset: fc_barcelona_laliga_player_sot_profiles
    domain: sports_analytics
    description: Complete L3/L5/L10/L15 player SOT profiles with team-match and appearance denominators, hit rates, dispersion, minutes, SOT/90, venue splits and trend.
    grain: as_of_date x competition x club x player
    keys: [as_of_date, competition, club, player]
    cadence: snapshot
    usage_tier: research_only
    consumers: [python, power_bi, ml]

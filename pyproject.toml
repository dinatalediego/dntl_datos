[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dntl-datos"
version = "0.2.0"
description = "Public batch data hub and DNTL Datos Explorer API"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=17.0",
  "requests>=2.32",
  "yfinance>=0.2.54",
  "PyYAML>=6.0",
  "fastapi>=0.141.1,<1.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
billboard = ["billboard.py>=7.1.0"]
dev = ["pytest>=8.0", "httpx>=0.28"]

[project.scripts]
dntl-datos = "dntl_datos.cli:main"
dntl-datos-api = "dntl_datos.web_api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

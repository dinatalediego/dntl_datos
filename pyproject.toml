[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dntl-datos"
version = "0.1.0"
description = "Batch ingestion hub for public market, macro and music data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=17.0",
  "requests>=2.32",
  "yfinance>=0.2.54",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
billboard = ["billboard.py>=7.1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
dntl-datos = "dntl_datos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

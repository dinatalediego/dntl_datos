name: Public batch ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1-5"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: dntl-datos --config config/sources.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: public-batch-${{ github.run_id }}
          path: data/raw
          retention-days: 14
